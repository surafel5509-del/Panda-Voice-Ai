name: MotionForge Agent CI
on:
  push:
    branches: [motion-agent-foundation]
    paths:
      - "motion_agent/**"
      - ".github/workflows/motion-agent-ci.yml"
  pull_request:
    paths:
      - "motion_agent/**"
      - ".github/workflows/motion-agent-ci.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motion_agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pytest -q
